<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAN TEAM — Em breve</title>
<meta name="description" content="GAN TEAM — site em construção. No days off.">
<style>
  :root{
    --bg:#0a0a0a;
    --accent:#DC143C;
    --text:#f2f0ec;
    --muted:#9a9690;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    overflow-x:hidden;
  }
  .stars{
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 15%, #fff 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 80% 60%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 70%, #fff 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 90% 80%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 45%, #fff 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 10% 85%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 25%, #fff 0%, transparent 100%);
    background-repeat:repeat;
    background-size:600px 600px;
    opacity:0.5;
    animation:twinkle 5s ease-in-out infinite alternate;
    pointer-events:none;
  }
  @keyframes twinkle{
    from{ opacity:0.3; }
    to{ opacity:0.7; }
  }
  .glow{
    position:fixed;
    top:-20%;
    left:50%;
    transform:translateX(-50%);
    width:900px;
    height:900px;
    background:radial-gradient(circle, rgba(220,20,60,0.18) 0%, rgba(220,20,60,0) 65%);
    pointer-events:none;
  }
  .wrap{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px 20px;
  }
  .logo{
    width:min(60vw, 280px);
    height:auto;
    filter:drop-shadow(0 0 40px rgba(220,20,60,0.35));
    margin-bottom:28px;
  }
  h1{
    font-size:clamp(22px, 5vw, 34px);
    letter-spacing:0.12em;
    text-transform:uppercase;
    margin:0 0 10px;
    font-weight:800;
  }
  h1 span{ color:var(--accent); }
  p.sub{
    color:var(--muted);
    font-size:15px;
    max-width:420px;
    line-height:1.6;
    margin:0 0 30px;
  }
  .divider{
    width:60px;
    height:2px;
    background:var(--accent);
    margin:0 0 30px;
  }
  .social{
    display:flex;
    gap:18px;
    margin-bottom:36px;
  }
  .social a{
    color:var(--text);
    text-decoration:none;
    font-size:13px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    border:1px solid rgba(255,255,255,0.15);
    padding:10px 20px;
    border-radius:999px;
    transition:border-color 0.2s, color 0.2s;
  }
  .social a:hover{
    border-color:var(--accent);
    color:var(--accent);
  }
  footer{
    position:relative;
    padding-bottom:24px;
    font-size:11px;
    color:#555;
    letter-spacing:0.04em;
  }
</style>
</head>
