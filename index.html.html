<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAN TEAM — Em construção</title>
<meta name="description" content="GAN TEAM — site em construção. No days off.">
<style>
  :root{
    --bg:#0a0a0a;
    --accent:#DC143C;
    --text:#f2f0ec;
    --muted:#9a9690;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  }
  .page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  @media (min-width:700px){
    .page{ justify-content:center; }
  }
  .hero-wrap{
    width:100%;
    line-height:0;
    flex-shrink:0;
  }
  .hero-wrap img{
    width:100%;
    height:auto;
    display:block;
  }
  .content{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:32px 20px 24px;
    max-width:520px;
    margin:0 auto;
  }
  p.sub{
    color:var(--muted);
    font-size:14.5px;
    line-height:1.6;
    margin:0 0 22px;
  }
  .social{
    display:flex;
    justify-content:center;
    gap:16px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .social a{
    color:var(--text);
    text-decoration:none;
    font-size:12.5px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    border:1px solid rgba(255,255,255,0.18);
    padding:10px 22px;
    border-radius:999px;
    transition:border-color 0.2s, color 0.2s;
  }
  .social a:hover{
    border-color:var(--accent);
    color:var(--accent);
  }
  footer{
    font-size:11px;
    color:#555;
    letter-spacing:0.04em;
    padding-bottom:18px;
  }
</style>
</head>
